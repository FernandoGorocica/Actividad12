<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Chuck Norris Jokes</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="styles.css">
    <!-- Vue.js -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
</head>
<body>
    <div id="app">
        <h1 class="text-center my-5 text-danger">Chuck Norris Facts</h1>
        <div class="container">
            <div class="row">
                <chuck-card 
                    v-for="(joke, index) in chuck"
                    :key="index"
                    :icon_url="joke.icon_url"
                    :value="joke.value"
                ></chuck-card>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Componente de tarjeta
        Vue.component('chuck-card', {
            props: ['icon_url', 'value'],
            template: `
                <div class="col-12 col-md-4 mb-4">
                    <div class="card h-100 shadow-sm">
                        <img :src="icon_url" class="card-img-top p-3" alt="Chuck Avatar">
                        <div class="card-body">
                            <p class="card-text text-muted">{{ value }}</p>
                        </div>
                    </div>
                </div>
            `
        });

        // Instancia Vue
        new Vue({
            el: '#app',
            data() {
                return {
                    chuck: [
                        { 
                            icon_url: "https://assets.chucknorris.host/img/avatar/chuck-norris.png",
                            value: "Chuck Norris puede saltar en paracaídas al espacio exterior." 
                        },
                        { 
                            icon_url: "https://assets.chucknorris.host/img/avatar/chuck-norris.png",
                            value: "El principal producto de Chuck Norris es el dolor." 
                        },
                        { 
                            icon_url: "https://assets.chucknorris.host/img/avatar/chuck-norris.png",
                            value: "Chuck Norris no lee libros. Los mira fijamente hasta que encuentra la información que busca." 
                        },
                        { 
                            icon_url: "https://assets.chucknorris.host/img/avatar/chuck-norris.png",
                            value: "El tiempo no espera a nadie. A menos que ese hombre sea Chuck Norris." 
                        },
                        { 
                            icon_url: "https://assets.chucknorris.host/img/avatar/chuck-norris.png",
                            value: "Si deletreas Chuck Norris en Scrabble, ganas. Para siempre." 
                        }
                    ]
                };
            }
        });
    </script>
</body>
</html>
